<section class="contato-page">
  <div class="container">
    <div class="page-header animate-fade-in-up">
      <h1>Contato</h1>
      <div class="header-line"></div>
      <p class="header-subtitle">Vamos conversar sobre seu projeto ou ideia</p>
    </div>

    <div class="contato-content">
      <div class="contato-info animate-slide-in-left">
        <div class="info-card">
          <div class="info-icon">✉</div>
          <h3>Email</h3>
          <a href="mailto:rafael@example.com">rafael@example.com</a>
        </div>

        <div class="info-card">
          <div class="info-icon">📱</div>
          <h3>Telefone</h3>
          <a href="tel:+5511999999999">+55 (11) 99999-9999</a>
        </div>

        <div class="info-card">
          <div class="info-icon">📍</div>
          <h3>Localização</h3>
          <p>São Paulo, SP - Brasil</p>
        </div>

        <div class="social-links">
          <h3>Redes Sociais</h3>
          <div class="socials">
            <a href="https://github.com" target="_blank" rel="noopener" class="social-btn">GitHub</a>
            <a href="https://linkedin.com" target="_blank" rel="noopener" class="social-btn">LinkedIn</a>
            <a href="https://twitter.com" target="_blank" rel="noopener" class="social-btn">Twitter</a>
          </div>
        </div>
      </div>

      <form class="contato-form animate-slide-in-right" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Nome</label>
          <input 
            id="name" 
            type="text" 
            placeholder="Seu nome completo"
            [(ngModel)]="formData.name"
            name="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            id="email" 
            type="email" 
            placeholder="seu@email.com"
            [(ngModel)]="formData.email"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="subject">Assunto</label>
          <input 
            id="subject" 
            type="text" 
            placeholder="Assunto da mensagem"
            [(ngModel)]="formData.subject"
            name="subject"
          />
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea 
            id="message" 
            placeholder="Sua mensagem aqui..."
            rows="6"
            [(ngModel)]="formData.message"
            name="message"
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading">
          {{ loading ? 'Enviando...' : 'Enviar Mensagem' }}
        </button>

        <div *ngIf="submitted" class="success-message animate-fade-in">
          ✓ Mensagem enviada com sucesso! Entrarei em contato em breve.
        </div>
      </form>
    </div>
  </div>
</section>

<app-footer></app-footer>
