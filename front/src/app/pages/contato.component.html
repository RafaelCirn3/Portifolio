<section class="contato-page">
  <div class="container">
    <div class="page-header animate-fade-in-up">
      <h1>Contato</h1>
      <div class="header-line"></div>
      <p class="header-subtitle">Se você precisa automatizar processos, estruturar dados ou desenvolver um sistema
        escalável, podemos conversar.</p>
    </div>

    <div class="contato-content">
      <div class="contato-info animate-slide-in-left">
        <div class="info-card">
          <div class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M4 7L12 13L20 7"></path>
            </svg>
          </div>
          <h3>Email</h3>
          <a href="mailto:cirnerafael06@gmail.com">cirnerafael06@gmail.com</a>
        </div>

        <div class="info-card">
          <div class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M8 4H16C17.1 4 18 4.9 18 6V18C18 19.1 17.1 20 16 20H8C6.9 20 6 19.1 6 18V6C6 4.9 6.9 4 8 4Z"></path>
              <path d="M10 17H14"></path>
            </svg>
          </div>
          <h3>Telefone</h3>
          <a href="tel:+5583991441464">+55 (83) 99144-1464</a>
        </div>

        <div class="info-card">
          <div class="info-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 21C12 21 18 15.5 18 10C18 6.7 15.3 4 12 4C8.7 4 6 6.7 6 10C6 15.5 12 21 12 21Z"></path>
              <circle cx="12" cy="10" r="2"></circle>
            </svg>
          </div>
          <h3>Localização</h3>
          <p>João Pessoa, PB - Brasil</p>
        </div>
      </div>

      <form class="contato-form animate-slide-in-right" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Nome</label>
          <input id="name" type="text" placeholder="Seu nome completo" [(ngModel)]="formData.name" name="name"
            required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="seu@email.com" [(ngModel)]="formData.email" name="email"
            required />
        </div>

        <div class="form-group">
          <label for="subject">Assunto</label>
          <input id="subject" type="text" placeholder="Assunto da mensagem" [(ngModel)]="formData.subject"
            name="subject" />
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea id="message" placeholder="Sua mensagem aqui..." rows="6" [(ngModel)]="formData.message"
            name="message" required></textarea>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading" [attr.aria-busy]="loading">
          {{ loading ? 'Enviando...' : 'Enviar Mensagem' }}
        </button>

        <div *ngIf="submitted" class="success-message animate-fade-in" role="status" aria-live="polite">
          Mensagem enviada com sucesso. Entrarei em contato em breve.
        </div>
      </form>
    </div>
  </div>
</section>

<app-footer></app-footer>
