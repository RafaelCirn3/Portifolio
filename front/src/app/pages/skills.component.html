<section class="skills-page">
  <div class="container">
    <div class="page-header animate-fade-in-up">
      <h1>Skills</h1>
      <div class="header-line"></div>
      <p class="header-subtitle">Tecnologias e ferramentas utilizadas no desenvolvimento de sistemas e automações.</p>
    </div>

    <div class="skills-grid">
      <div *ngFor="let skillGroup of skillsData; let i = index" class="skill-category animate-fade-in-up" [style.animation-delay]="(i * 80) + 'ms'">
        <h3>{{ skillGroup.category }}</h3>
        
        <div class="skills-list">
          <div *ngFor="let skill of skillGroup.skills" class="skill-item">
            <div class="skill-header">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-percentage">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar">
              <div class="skill-fill" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
