<section class="projetos-page">
  <div class="container">
    <div class="page-header animate-fade-in-up">
      <h1>Projetos</h1>
      <div class="header-line"></div>
      <p class="header-subtitle">Soluções desenvolvidas com foco em automação, dados e sistemas escaláveis.</p>
    </div>

    <div class="projects-grid">
      <div *ngFor="let project of projects; let i = index" class="project-card animate-fade-in-up" [style.animation-delay]="(i * 50) + 'ms'">
        <div class="project-header">
          <h3>{{ project.title }}</h3>
          <a [href]="project.link" target="_blank" rel="noopener" class="project-link" [attr.aria-label]="'Ver detalhes de ' + project.title">Abrir</a>
        </div>

        <p class="project-description">{{ project.description }}</p>

        <div class="project-tech">
          <span *ngFor="let tech of project.technologies" class="tech-tag">{{ tech }}</span>
        </div>

        <a [href]="project.link" target="_blank" rel="noopener" class="project-button">Ver projeto</a>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
