<div class="not-found-container">
  <div class="not-found-content">
    <h1 class="error-code">404</h1>
    <h2 class="error-message">{{ i18n.t('notFoundTitle') }}</h2>
    <p class="error-description">{{ i18n.t('notFoundText') }}</p>
    
    <a routerLink="/" class="back-button">{{ i18n.t('notFoundBack') }}</a>
  </div>

  <div class="decorative-elements">
    @for (square of decorativeSquares; track square.id) {
      <div 
        class="decorative-square"
        [style.animation-delay]="square.delay + 's'"
        [style.--duration]="square.duration + 's'"
      ></div>
    }
  </div>
</div>
