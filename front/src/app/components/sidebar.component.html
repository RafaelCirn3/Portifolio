<aside class="sidebar" [attr.aria-label]="i18n.t('navSideLabel')">
  <a routerLink="/" class="sidebar-logo" [title]="i18n.t('navHome')" [attr.aria-label]="i18n.t('logoHomeLabel')">
    <img src="/rafael_logo_64.png" 
         srcset="/rafael_logo_16.png 16w, 
                 /rafael_logo_32.png 32w, 
                 /rafael_logo_48.png 48w, 
                 /rafael_logo_64.png 64w, 
                 /rafael_logo_128.png 128w, 
                 /rafael_logo_256.png 256w, 
                 /rafael_logo_512.png 512w" 
         sizes="50px"
         width="50"
         height="50"
         alt="Rafael Cirne"
         class="sidebar-logo-img">
  </a>

  <nav class="sidebar-nav" [attr.aria-label]="i18n.t('navMainLabel')">
    <a routerLink="/" class="sidebar-link" [title]="i18n.t('navHome')" [attr.aria-label]="i18n.t('navHome')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M4 11L12 4L20 11"></path>
          <path d="M6.5 10V20H17.5V10"></path>
          <path d="M10 20V14H14V20"></path>
        </svg>
      </span>
    </a>
    <a routerLink="/sobre" class="sidebar-link" [title]="i18n.t('navAbout')" [attr.aria-label]="i18n.t('navAbout')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <circle cx="12" cy="8" r="3"></circle>
          <path d="M5.5 20C6.5 16.5 8.8 14.5 12 14.5C15.2 14.5 17.5 16.5 18.5 20"></path>
        </svg>
      </span>
    </a>
    <a routerLink="/projetos" class="sidebar-link" [title]="i18n.t('navProjects')" [attr.aria-label]="i18n.t('navProjects')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="5" width="7" height="6" rx="1"></rect>
          <rect x="13" y="5" width="7" height="6" rx="1"></rect>
          <rect x="4" y="13" width="7" height="6" rx="1"></rect>
          <rect x="13" y="13" width="7" height="6" rx="1"></rect>
        </svg>
      </span>
    </a>
    <a routerLink="/skills" class="sidebar-link" [title]="i18n.t('navSkills')" [attr.aria-label]="i18n.t('navSkills')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 3V21"></path>
          <path d="M4 8H20"></path>
          <path d="M6 16H18"></path>
          <circle cx="8" cy="8" r="2"></circle>
          <circle cx="16" cy="16" r="2"></circle>
        </svg>
      </span>
    </a>
    <a routerLink="/experiencia" class="sidebar-link" [title]="i18n.t('navExperience')" [attr.aria-label]="i18n.t('navExperience')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="7" width="16" height="12" rx="2"></rect>
          <path d="M9 7V5H15V7"></path>
          <path d="M4 12H20"></path>
        </svg>
      </span>
    </a>
    <a routerLink="/contato" class="sidebar-link" [title]="i18n.t('navContact')" [attr.aria-label]="i18n.t('navContact')">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M4 7L12 13L20 7"></path>
        </svg>
      </span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="https://github.com/RafaelCirn3" target="_blank" rel="noopener" class="social-link" title="GitHub" [attr.aria-label]="i18n.t('githubLabel')">
      <span>GH</span>
    </a>
    <a href="https://www.linkedin.com/in/rafael-medeiros-1b183a327/" target="_blank" rel="noopener" class="social-link" title="LinkedIn" [attr.aria-label]="i18n.t('linkedinLabel')">
      <span>LI</span>
    </a>
